name: SipAndSee
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  SipAndSee:
    type: application
    platform: iOS
    sources:
      - path: SipAndSee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alanlu01.SipAndSee
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 一杯提案
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SipAndSeeTests
        - SipAndSeeUITests
  SipAndSeeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SipAndSeeTests
    dependencies:
      - target: SipAndSee
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SipAndSeeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SipAndSeeUITests
    dependencies:
      - target: SipAndSee
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
